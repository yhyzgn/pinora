[package]
name = "pinora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pinora application lifecycle, runtime, and dependency assembly"

[dependencies]
pinora-core = { workspace = true }
fs2 = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp"] }
png = "0.17"
xcap = "0.9.7"
winit = "0.30"
softbuffer = "0.4"
global-hotkey = "0.7"
# 关闭 libxdo 默认特性，避免链接 -lxdo（Wayland/KDE 不需要）
tray-icon = { version = "0.19", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon/muda 在 Linux 上依赖 GTK 菜单；其他平台不应拉入 GTK/GLib
gtk = "0.18"
# XDG GlobalShortcuts Portal 仅用于纯 Wayland 会话；请求与信号等待在后台线程完成。
# 这些包已由 xcap 间接锁定，显式声明只为收窄 Pinora 的直接 API 依赖边界。
async-channel = "2"
futures-lite = "2"
zbus = "5.18.0"
